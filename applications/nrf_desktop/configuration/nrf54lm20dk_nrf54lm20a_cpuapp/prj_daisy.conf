################################################################################
# Daisy: Framework Wireless Touchpad Keyboard USB-A dongle
#
# Connects to Daisy keyboards over Bluetooth LE and forwards their HID reports
# to USB.
#
# Application Configuration

CONFIG_DESKTOP_INIT_LOG_HID_REPORT_EVENT=n
CONFIG_DESKTOP_INIT_LOG_HID_REPORT_SENT_EVENT=n
CONFIG_CAF_INIT_LOG_KEEP_ALIVE_EVENTS=n

CONFIG_DESKTOP_ROLE_HID_DONGLE=y
CONFIG_DESKTOP_HID_BOOT_INTERFACE_KEYBOARD=y

CONFIG_DESKTOP_DEVICE_VID=0x32AC
CONFIG_DESKTOP_DEVICE_PID=0x0039
CONFIG_DESKTOP_DEVICE_MANUFACTURER="Framework"
CONFIG_DESKTOP_DEVICE_PRODUCT="Wireless Touchpad Keyboard USB-A Dongle"

# Keyboards only, several at once.
CONFIG_DESKTOP_HID_DONGLE_BOND_COUNT=4
CONFIG_DESKTOP_HID_DONGLE_CONN_COUNT=4
CONFIG_DESKTOP_BLE_SCAN_MOUSE_LIMIT=0
CONFIG_DESKTOP_BLE_SCAN_KEYBOARD_LIMIT=4

# Forward the keyboard's keyboard and touchpad HID Services to USB as they are
# (hid_passthrough_def.h), instead of translating them to the nRF Desktop
# report map. All keyboards share the two USB HID instances.
CONFIG_DESKTOP_HID_FORWARD_ENABLE=n
CONFIG_DESKTOP_HID_PASSTHROUGH_ENABLE=y
# The touchpad service has 8 reports, around 40 attributes.
CONFIG_BT_GATT_DM_MAX_ATTRS=100

# The Daisy keyboard (ZMK) has no nRF Desktop device description service.
CONFIG_DESKTOP_BLE_DISCOVERY_DEV_DESCR_OPTIONAL=y

CONFIG_DESKTOP_USB_ENABLE=y
# Enable the only USB stack that supports USBHS
CONFIG_DESKTOP_USB_STACK_NEXT=y

# No buttons and no LEDs on the dongle. The dongle looks for new keyboards
# whenever it has a free bond slot.
CONFIG_CAF_BUTTONS=n
CONFIG_CAF_LEDS=n

################################################################################
# Zephyr Configuration

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3584
CONFIG_ISR_STACK_SIZE=2560
CONFIG_MAIN_STACK_SIZE=2816
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=1536
CONFIG_IDLE_STACK_SIZE=512

CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_NUM_COOP_PRIORITIES=10
CONFIG_NUM_PREEMPT_PRIORITIES=15

CONFIG_HEAP_MEM_POOL_SIZE=2560

CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_SYSTEM_CLOCK_NO_WAIT=y

CONFIG_HW_STACK_PROTECTION=y
# Reboot on a fault instead of halting: a customer can't recover a halted
# dongle without SWD.
CONFIG_RESET_ON_FATAL_ERROR=y

CONFIG_GPIO=y

CONFIG_REBOOT=y

CONFIG_SPEED_OPTIMIZATIONS=y

# The dongle has no 32 kHz crystal.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# The UDC DWC2 DMA support is experimental. Disable the feature to improve USB stability. Since nRF
# Desktop uses only small HID reports (size < 64 bytes), the DMA doesn't improve performance.
CONFIG_UDC_DWC2_DMA=n

CONFIG_BT_PRIVACY=y

# ATT MTU: the touchpad's PTP reports are 29 bytes, more than the 20 bytes of
# the default MTU of 23. Match the keyboard's 65/69 (the link uses the smaller
# of the two) and exchange the MTU on connect.
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_BUF_ACL_TX_SIZE=69
CONFIG_BT_CTLR_DATA_LENGTH_MAX=69
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
# ATT/ACL TX buffers: setting up a keyboard's two HID Services at once
# (discovery, report map reads, CCC writes) starves the defaults, and CCC
# writes get dropped. BT_BUF_EVT_RX_COUNT must stay greater than
# BT_BUF_ACL_TX_COUNT.
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10

CONFIG_BT_CTLR_SDC_LLPM=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y

# Keep the settings backend of the dongles in the field (NVS), so an update
# keeps the keyboard bonds. NVS can't read ZMS records. The settings loader
# implies ZMS on RRAM, so NVS has to be enabled explicitly.
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_ZMS=n

# External FLASH is not used by the application. Disable the driver.
CONFIG_SPI_NOR=n

# Assign RRAM write buffer size to ensure short write slots. Trying to allocate long write slots
# while maintaining a BLE connection with short interval and no connection latency may lead to
# timeouts in flash_sync_mpsl.
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=8

# Enable code partitioning with DTS
CONFIG_USE_DT_CODE_PARTITION=y

################################################################################

CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

# The dongle has no UART wiring. Read the logs over SWD with RTT.
CONFIG_DESKTOP_LOG=y
CONFIG_DESKTOP_LOG_UART=n
CONFIG_DESKTOP_LOG_RTT=y
