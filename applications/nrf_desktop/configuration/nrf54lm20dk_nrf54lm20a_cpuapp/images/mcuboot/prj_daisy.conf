#
# MCUboot of the Daisy dongle, the same configuration as hid-remapper-private
# sysbuild/mcuboot/prj.conf. Not carried over: BOOT_SERIAL_CDC_ACM_BCD_DEVICE,
# which needs the FrameworkComputer mcuboot fork.

CONFIG_PM=n

CONFIG_MAIN_STACK_SIZE=10240

CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_BOOTSTRAP=n

CONFIG_FLASH=y
CONFIG_FPROTECT=n

# Daisy dongle has no 32 kHz crystal; use internal RC for LFCLK
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_CBPRINTF_NANO=y
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="MCUboot"

CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# Single-slot serial recovery via USB CDC ACM, with retention-driven entry
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
# Default-on with MCUBOOT_SERIAL: io_detect_pin() configures the DK's
# mcuboot-button0 (P1.26, DT flags carry GPIO_PULL_UP) and leaves it that way
# across the chain-load, so the pull-up stays on for the app's whole life.
# Daisy has no such button and recovery is entered through the retention boot
# mode above.
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n

CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_VID=0x32AC
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_PID=0x0039
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_MANUFACTURER="Framework"
CONFIG_BOOT_SERIAL_CDC_ACM_STRING_PRODUCT="USB-A Bluetooth Dongle (Recovery)"
