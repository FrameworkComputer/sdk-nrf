# Same bootloader setup as the dongles in the field: a single application slot
# and MCUboot serial recovery over USB CDC ACM for updates.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_PURE=y
SB_CONFIG_MCUBOOT_SIGNATURE_USING_KMU=n
SB_CONFIG_MERGED_HEX_FILES=y

SB_CONFIG_PARTITION_MANAGER=n
